# Local development only - start Docker Desktop first, then:
# docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: hypermarket-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hypermarket
    ports:
      - "5432:5432"
    volumes:
      - hypermarket_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hypermarket-redis
    ports:
      - "6379:6379"

volumes:
  hypermarket_pg_data:
