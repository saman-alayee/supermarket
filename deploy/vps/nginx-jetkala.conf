# Primary domain: jetkala.shop
# Legacy kiaakala.ir redirects to jetkala.shop

map $host $canonical_host {
    default              jetkala.shop;
    jetkala.shop         jetkala.shop;
    www.jetkala.shop     jetkala.shop;
    kiaakala.ir          jetkala.shop;
    www.kiaakala.ir      jetkala.shop;
}

# --- HTTP: jetkala.shop ---
server {
    listen 80;
    listen [::]:80;
    server_name jetkala.shop www.jetkala.shop;

    location ^~ /.well-known/ {
        root /var/www/kiaakala;
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "no-store";
        allow all;
    }

    location / {
        return 301 https://jetkala.shop$request_uri;
    }
}

# --- HTTP: legacy domain → new domain ---
server {
    listen 80;
    listen [::]:80;
    server_name kiaakala.ir www.kiaakala.ir;

    location ^~ /.well-known/ {
        root /var/www/kiaakala;
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "no-store";
        allow all;
    }

    location / {
        return 301 https://jetkala.shop$request_uri;
    }
}

# --- HTTPS: jetkala.shop (primary) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jetkala.shop www.jetkala.shop;

    ssl_certificate /opt/kiaakala/ssl/fullchain.pem;
    ssl_certificate_key /opt/kiaakala/ssl/private.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    root /var/www/kiaakala;
    index index.html;

    location ^~ /.well-known/ {
        root /var/www/kiaakala;
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "no-store";
        allow all;
    }

    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Session-Id $http_x_session_id;
    }

    location /uploads/ {
        alias /opt/kiaakala/api/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /images/ {
        alias /var/www/kiaakala/images/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri/index.html $uri /index.html;
    }
}

# --- HTTPS: legacy domain → redirect ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kiaakala.ir www.kiaakala.ir;

    ssl_certificate /opt/kiaakala/ssl/kiaakala-legacy-fullchain.pem;
    ssl_certificate_key /opt/kiaakala/ssl/kiaakala-legacy-private.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://jetkala.shop$request_uri;
}

# --- Direct IP access (HTTP, dev/smoke tests) ---
server {
    listen 80;
    listen [::]:80;
    server_name 45.94.215.57;

    client_max_body_size 10M;
    root /var/www/kiaakala;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri/index.html $uri /index.html;
    }
}
