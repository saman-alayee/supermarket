server {
    listen 80;
    listen [::]:80;
    server_name kiaakala.ir www.kiaakala.ir;

    location ^~ /.well-known/ {
        alias /opt/kiaakala/ssl/.well-known/;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kiaakala.ir www.kiaakala.ir;

    ssl_certificate /opt/kiaakala/ssl/fullchain.pem;
    ssl_certificate_key /opt/kiaakala/ssl/private.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    root /var/www/kiaakala;
    index index.html;

    location ^~ /.well-known/ {
        alias /opt/kiaakala/ssl/.well-known/;
        default_type text/plain;
        allow all;
    }

    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Session-Id $http_x_session_id;
    }

    location /uploads/ {
        alias /opt/kiaakala/api/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /images/ {
        alias /var/www/kiaakala/images/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri/index.html $uri /index.html;
    }
}

# Optional direct IP access over HTTP (no redirect to HTTPS hostname)
server {
    listen 80;
    listen [::]:80;
    server_name 45.94.215.57;

    client_max_body_size 10M;
    root /var/www/kiaakala;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri/index.html $uri /index.html;
    }
}
