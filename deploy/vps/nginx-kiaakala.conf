server {
    listen 80;
    listen [::]:80;
    server_name kiaakala.ir www.kiaakala.ir 45.94.215.57;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    root /var/www/kiaakala;
    index index.html;

    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Session-Id $http_x_session_id;
    }

    location /uploads/ {
        alias /opt/kiaakala/api/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /images/ {
        alias /var/www/kiaakala/images/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Prefer .../index.html before bare $uri so directory paths don't 301 to trailing slash
    location / {
        try_files $uri/index.html $uri /index.html;
    }
}
